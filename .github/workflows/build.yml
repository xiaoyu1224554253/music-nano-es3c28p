name: Build music_nano (ES3C28P)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for ESP32-S3
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Upload merged binary
        uses: actions/upload-artifact@v4
        with:
          name: music_nano_es3c28p_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
