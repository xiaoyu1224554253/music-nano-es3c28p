## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=5.5.5'
  # #必须使用 idf 版本>=5.5.5
  # #在 ESP-IDF v5.5.2 ~ v5.5.4 上存在 SPI 总线锁"丢失唤醒"死锁 bug
  # #（esp-idf Issue #17860 / IDFGH-16778，修复 commit 26263a36）
  # #https://github.com/espressif/esp-idf/commit/26263a36a2b3fe0649ccb20a02517c6c4b18e01b


  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  lvgl/lvgl: ==8.3.11
  mydazy/esp_lcd_jd9853: ==2.0.0
  esphome/micro-mp3: ==0.4.0
  # 本地覆盖: 修复 JPEGDEC 对"三分量 1x2 采样"封面的支持 (managed_components 会被清空, 故放本地)
  bitbank2/jpegdec:
    version: ==1.6.2
    override_path: ../third_party/jpegdec
  esphome/micro-flac: ==0.2.0
